name: Windows Foundation Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build Windows desktop
        shell: pwsh
        run: |
          dotnet restore src/Unlocker.Desktop/Unlocker.Desktop.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Unlocker.Desktop/Unlocker.Desktop.csproj -c Release --no-restore -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline recovery tests
        shell: pwsh
        run: |
          dotnet run --project tests/Unlocker.Tests/Unlocker.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/Unlocker.Desktop/Unlocker.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable /p:WindowsAppSDKSelfContained=true /p:PublishTrimmed=false /p:PublishSingleFile=false /p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @('Unlocker.Desktop.exe', 'Microsoft.ui.xaml.dll', 'Microsoft.WindowsAppRuntime.dll', 'Microsoft.WindowsAppRuntime.Bootstrap.dll', 'Microsoft.WindowsAppRuntime.Bootstrap.Net.dll')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/portable' $file) -PathType Leaf)) { throw "Portable runtime payload missing: $file" }
          }
          Copy-Item LICENSE artifacts/portable/LICENSE
          Copy-Item README.md artifacts/portable/README.md
          Copy-Item tools/Diagnose-Startup.ps1 artifacts/portable/Diagnose-Startup.ps1
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/SimpleUnlockerNext-Foundation-win-x64.zip -CompressionLevel Optimal
          ((Get-FileHash artifacts/SimpleUnlockerNext-Foundation-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  SimpleUnlockerNext-Foundation-win-x64.zip') | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleUnlockerNext-Foundation-win-x64
          path: |
            artifacts/SimpleUnlockerNext-Foundation-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error